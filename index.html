<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Checkers Lab</title>
<meta name="description" content="Checkers and draughts (American, International, Russian, Brazilian) against a measured computer, with an evaluation bar, move grades, puzzles and online rooms.">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --bg: #0f1117; --bg-soft: #161923; --card: #1a1e2b; --line: #2a3042;
    --text: #e8eaf0; --muted: #969db4; --accent: #6ea8fe; --accent-warm: #f0b354;
    --good: #6ee7a8; --bad: #f08c8c;
    --sq-light: #e3cfa8; --sq-dark: #8a5a3b; --frame: #2b2118;
    --radius: 12px; --tabbar: 58px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); overflow: hidden;
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button, input, select { font: inherit; color: inherit; }
  #app { height: 100dvh; display: flex; flex-direction: column; overflow-x: clip; }
  .view { display: none; flex: 1; min-height: 0; padding: 10px 12px 8px; }
  .view.on { display: flex; flex-direction: column; }

  /* tab bar: phone bottom, laptop top */
  nav.tabs { order: 2; height: calc(var(--tabbar) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; background: #12151e; border-top: 1px solid var(--line); flex: none; }
  nav.tabs button { flex: 1; background: none; border: 0; color: var(--muted); display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px; font-size: 11.5px; font-weight: 600; cursor: pointer; min-width: 0; }
  nav.tabs button svg { width: 22px; height: 22px; }
  nav.tabs button.on { color: var(--accent); }
  nav.tabs .brand { display: none; }
  @media (min-width: 900px) {
    nav.tabs { order: 0; height: 52px; padding: 0 16px; border-top: 0; border-bottom: 1px solid var(--line); justify-content: flex-start; gap: 6px; }
    nav.tabs .brand { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 17px; margin-right: 22px; color: var(--text); text-decoration: none; }
    nav.tabs .brand img { width: 26px; height: 26px; border-radius: 6px; }
    nav.tabs button { flex: none; flex-direction: row; font-size: 14px; padding: 0 14px; gap: 8px; border-radius: 9px; height: 38px; align-self: center; }
    nav.tabs button.on { background: rgba(110,168,254,.12); }
    nav.tabs button svg { width: 18px; height: 18px; }
    .view { padding: 14px 18px; }
  }

  /* common bits */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; cursor: pointer;
    font-weight: 650; transition: background .12s, transform .08s, border-color .12s; white-space: nowrap; }
  .btn:active:not(:disabled) { transform: scale(.97); }
  .btn:disabled { opacity: .38; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0d1424; }
  .btn.warm { background: var(--accent-warm); border-color: var(--accent-warm); color: #24180a; }
  .btn.ghost { background: transparent; }
  .btn.small { min-height: 34px; padding: 0 11px; font-size: 13.5px; border-radius: 8px; }
  .btn svg { width: 18px; height: 18px; }
  .seg { display: flex; gap: 6px; }
  .seg button { flex: 1; min-height: 44px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 650; font-size: 14px; padding: 4px 4px; min-width: 0; }
  .seg button[aria-pressed="true"] { background: rgba(110,168,254,.14); border-color: var(--accent); color: var(--accent); }
  .seg button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .seg.tight button { min-height: 38px; font-size: 13px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; min-width: 0; }
  .q { width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg-soft); color: var(--muted);
    font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0; vertical-align: middle; flex: none; }
  .pop { position: fixed; z-index: 60; max-width: min(320px, calc(100vw - 32px)); background: #232838; border: 1px solid #3a4258; border-radius: 10px;
    padding: 10px 12px; font-size: 13.5px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .switch { position: relative; width: 48px; height: 28px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #2f3548; border-radius: 14px; transition: background .15s; cursor: pointer; }
  .switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + span { background: var(--accent); }
  .switch input:checked + span::after { transform: translateX(20px); }
  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; min-height: 0; }
  .num { font-variant-numeric: tabular-nums; font-weight: 750; }
  .small { font-size: 12.5px; }
  .toast { position: fixed; left: 50%; bottom: calc(var(--tabbar) + 14px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2a3042; padding: 9px 14px; border-radius: 10px; font-size: 13.5px; z-index: 80; animation: up .2s; max-width: calc(100vw - 32px); }
  @media (min-width: 900px) { .toast { bottom: 24px; } }
  @keyframes up { from { transform: translate(-50%, 16px); opacity: .3; } to { transform: translate(-50%, 0); opacity: 1; } }
  .confirm-back { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fade .15s; }
  .confirm-back .panel { max-width: 360px; width: 100%; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .sheet-back { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s; }
  .sheet { width: 100%; max-width: 520px; max-height: 80dvh; background: var(--card); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 10px; animation: sheetup .22s ease-out; }
  @media (min-width: 900px) { .sheet-back { align-items: center; } .sheet { border-radius: 16px; max-width: 450px; } }
  @keyframes sheetup { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
  .sheet h3 { margin: 0; font-size: 16px; }
  .menu-list { display: flex; flex-direction: column; gap: 6px; }
  .menu-list .btn { justify-content: flex-start; width: 100%; }

  /* ---------------------------------------------------------------- the board */
  .board-wrap { position: relative; flex: none; }
  .board { position: relative; width: 100%; aspect-ratio: 1; border-radius: 6px; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
    background: var(--sq-light); box-shadow: 0 0 0 4px var(--frame), 0 8px 24px rgba(0,0,0,.5); }
  .board .sq { position: absolute; background: var(--sq-dark); }
  .board .sq.last { background: #a8783f; }
  .board .sq.from { background: #b98b45; }
  .board .sq .no { position: absolute; left: 3%; top: 1%; font-size: clamp(7px, 1.9vmin, 11px); color: rgba(255,240,220,.6); font-weight: 650; pointer-events: none; }
  .board .dot { position: absolute; border-radius: 50%; pointer-events: none; background: rgba(110,168,254,.9); box-shadow: 0 0 0 3px rgba(110,168,254,.25); transform: translate(-50%, -50%); width: calc(var(--cell) * .3); height: calc(var(--cell) * .3); animation: dotin .14s ease-out; }
  .board .dot.cap { background: rgba(240,140,140,.95); box-shadow: 0 0 0 3px rgba(240,140,140,.3); }
  .board .dot.step { background: transparent; box-shadow: inset 0 0 0 3px rgba(110,168,254,.9); width: calc(var(--cell) * .78); height: calc(var(--cell) * .78); }
  @keyframes dotin { from { transform: translate(-50%, -50%) scale(.3); opacity: 0; } to { transform: translate(-50%, -50%); opacity: 1; } }
  .board .pc { position: absolute; pointer-events: none; transition: left .17s ease-in-out, top .17s ease-in-out, opacity .2s, transform .12s; will-change: left, top; }
  .board .pc svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .board .pc.sel { transform: scale(1.1); filter: drop-shadow(0 0 5px rgba(240,179,84,.95)); }
  .board .pc.can { filter: drop-shadow(0 0 4px rgba(110,168,254,.95)); }
  .board .pc.must { animation: must 0.5s ease-in-out 2; }
  @keyframes must { 50% { transform: scale(1.14); filter: drop-shadow(0 0 7px rgba(240,140,140,1)); } }
  .board .pc.gone { opacity: 0; transform: scale(.6); }
  .board .pc.drag { transition: none; z-index: 5; transform: scale(1.15); }
  .board .pc.crowned svg .crownuse { animation: crownin .35s ease-out; transform-origin: 50% 50%; }
  @keyframes crownin { from { transform: scale(.2) translateY(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .board svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; }

  /* eval bar */
  .evalbar { position: relative; background: #e8e2d4; border-radius: 4px; overflow: hidden; }
  .evalbar i { position: absolute; background: #23252c; transition: all .45s ease; }
  .evalbar.h { height: 8px; }
  .evalbar.h i { left: 0; top: 0; bottom: 0; }
  .evalbar.v { width: 14px; }
  .evalbar.v i { left: 0; right: 0; top: 0; }
  .evalbar.off { visibility: hidden; }

  /* ---------------------------------------------------------------- play */
  #game { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  #game > * { width: 100%; }
  .pl { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 2px; }
  .disc { width: 22px; height: 22px; flex: none; }
  .palette .disc { width: 26px; height: 26px; }
  .pl .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .pl .sub { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .pl .cap { display: flex; align-items: center; gap: 1px; margin-left: auto; flex: none; }
  .pl .cap svg { width: 14px; height: 14px; margin-left: -4px; }
  .pl .cap b { font-size: 12.5px; margin-left: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .pl.turn .nm::after { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent-warm); margin-left: 7px; vertical-align: 1px; box-shadow: 0 0 6px var(--accent-warm); }
  .pl.away { opacity: .55; }
  .coach { display: flex; align-items: center; gap: 8px; min-height: 36px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; font-size: 13.5px; overflow: hidden; }
  .coach .ev { font-variant-numeric: tabular-nums; font-weight: 800; min-width: 44px; }
  .coach .msg { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .grade { display: inline-block; font-weight: 750; border-radius: 6px; padding: 0 6px; font-size: 12px; line-height: 19px; color: #0f1117; }
  .g-best { background: #6ee7a8; } .g-good { background: #a8e08a; } .g-forced { background: #9aa3bd; }
  .g-inacc { background: #f0d36e; } .g-mistake { background: #f0a86e; } .g-blunder { background: #f08c8c; }
  .acts { display: flex; gap: 8px; }
  .acts .btn { flex: 1; padding: 0 8px; }
  .boardcol { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  #g-side { display: none; }
  .endcard { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 6; background: rgba(15,17,23,.45); animation: fade .3s; border-radius: 6px; }
  .endcard .panel { text-align: center; display: flex; flex-direction: column; gap: 8px; min-width: 220px; box-shadow: 0 12px 30px rgba(0,0,0,.6); }
  .endcard h2 { margin: 0; font-size: 22px; }
  .offerbar { display: flex; align-items: center; gap: 8px; background: rgba(240,179,84,.12); border: 1px solid var(--accent-warm); border-radius: 10px; padding: 4px 6px 4px 12px; font-size: 13.5px; }
  @media (min-width: 900px) {
    #game { flex-direction: row; align-items: stretch; justify-content: center; gap: 18px; }
    #game > * { width: auto; }
    .boardcol { flex: none; }
    #g-side { display: flex; flex-direction: column; gap: 10px; width: 340px; min-height: 0; }
    #g-side .panel { padding: 10px 12px; }
    .ph-only { display: none !important; }
  }
  @media (max-width: 899px) { .lp-only { display: none !important; } }
  table.moves { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  table.moves td { padding: 3px 5px; border-top: 1px solid #222838; cursor: pointer; white-space: nowrap; }
  table.moves td.n { color: #59607a; width: 30px; cursor: default; }
  table.moves td.cur { background: rgba(110,168,254,.16); border-radius: 4px; }
  table.moves td .grade { margin-left: 4px; font-size: 10.5px; line-height: 15px; padding: 0 4px; }
  .pv { font-size: 13px; color: var(--muted); line-height: 1.5; }
  .pv b { color: var(--text); }

  /* setup */
  .setup { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 9px; max-width: 760px; width: 100%; margin: 0 auto; }
  .hero { display: flex; align-items: center; gap: 12px; }
  .hero img { width: 44px; height: 44px; border-radius: 10px; }
  .hero h1 { margin: 0; font-size: 23px; letter-spacing: -.01em; }
  .hero p { margin: 0; color: var(--muted); font-size: 13px; }
  .setup .panel { display: flex; flex-direction: column; gap: 9px; }
  .vgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .vgrid button { min-height: 50px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; padding: 4px 6px; text-align: left; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .vgrid button b { display: block; font-size: 14px; }
  .vgrid button small { display: block; color: var(--muted); font-size: 11px; }
  .vgrid button[aria-pressed="true"] { border-color: var(--accent); background: rgba(110,168,254,.12); }
  .vgrid .mini { width: 26px; height: 26px; flex: none; border-radius: 3px; }
  .vblurb { font-size: 12.5px; color: var(--muted); margin: -2px 0 0; }
  .txt { font-size: 16px; background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 8px; min-height: 42px; padding: 0 12px; width: 100%; min-width: 0; }
  .txt.code { text-transform: uppercase; letter-spacing: .2em; font-weight: 700; flex: 1; }
  .code-big { font-size: 38px; font-weight: 800; letter-spacing: .2em; padding-left: .2em; color: var(--accent-warm); font-variant-numeric: tabular-nums; }
  .seats { display: flex; flex-direction: column; gap: 6px; }
  .seatrow { display: flex; align-items: center; gap: 9px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px 5px 10px; font-size: 14px; min-height: 42px; }
  .seatrow svg { width: 20px; height: 20px; flex: none; }
  .vgrid button small, .vgrid button b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 899px) {
    .vgrid .mini, .hero p { display: none; }
    .vgrid button { min-height: 44px; padding: 3px 8px; }
    .hero img { width: 34px; height: 34px; }
    .setup .panel { padding: 11px 12px; gap: 8px; }
  }
  /* short or narrow phones (iPhone SE / mini): the setup scrolls inside its own area, never under the tab bar */
  .setup { overflow-y: auto; overscroll-behavior: contain; }
  @media (max-width: 899px) and (max-height: 620px) { .setup .hero, .setup .vblurb { display: none; } }
  @media (max-width: 359px) { .setup .panel button { font-size: 12px; padding-left: 2px; padding-right: 2px; } .setup .seg { gap: 4px; } .setup .seg button { padding-left: 0; padding-right: 0; letter-spacing: -.01em; } .vgrid button b { font-size: 13px; } }
  @media (min-width: 900px) {
    .setup.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-content: start; gap: 12px; max-width: 980px; }
    .setup.two .hero { grid-column: 1 / 3; }
    .vgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  /* review / analyze / puzzles shared */
  .split { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 7px; }
  .split .side { display: flex; flex-direction: column; gap: 7px; min-height: 0; flex: 1; }
  .chart { position: relative; height: 64px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; cursor: pointer; flex: none; }
  .chart svg { width: 100%; height: 100%; display: block; }
  .acc { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .acc .big { font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .navrow { display: flex; gap: 6px; }
  .navrow .btn { flex: 1; padding: 0 6px; }
  .palette { display: flex; gap: 6px; }
  .palette button { flex: 1; min-height: 42px; background: var(--bg-soft); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 2px; }
  .palette button svg { width: 28px; height: 28px; }
  .palette button[aria-pressed="true"] { border-color: var(--accent-warm); background: rgba(240,179,84,.14); }
  .palette .er { font-size: 12px; font-weight: 700; color: var(--muted); }
  @media (min-width: 900px) {
    .split { flex-direction: row; gap: 18px; justify-content: center; }
    .split .side { width: 360px; flex: none; }
    .chart { height: 120px; }
  }

  /* settings */
  .set { max-width: 680px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }
  .setrow { display: flex; align-items: center; gap: 10px; min-height: 48px; }
  .setrow .grow b { display: block; font-weight: 650; }
  .setrow .grow span { font-size: 12.5px; color: var(--muted); }
  .ver { color: #59607a; font-size: 12px; text-align: center; }
  .ver a { color: #59607a; }
  table.rt { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.rt th, table.rt td { padding: 4px 4px; border-top: 1px solid #222838; text-align: center; }
  table.rt th:first-child, table.rt td:first-child { text-align: left; color: var(--muted); font-weight: 600; }
  table.rt thead th { color: var(--text); font-weight: 700; border-top: 0; }
  .rtwrap { overflow-x: auto; margin: 0 -4px; }
  table.rt thead .btn { font-size: 12px; }
  #an-var { background: var(--bg-soft); color: var(--text); border: 1px solid var(--line); border-radius: 10px; min-height: 38px; padding: 0 8px; font-size: 16px; font-weight: 650; flex: none; max-width: 36%; -webkit-appearance: none; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 13px) 50%, calc(100% - 8px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 22px; }
  .strength td.sc { font-weight: 750; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gD" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#5a5e6b"/><stop offset=".55" stop-color="#2a2c34"/><stop offset="1" stop-color="#121318"/></radialGradient>
    <radialGradient id="gL" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#fffdf6"/><stop offset=".6" stop-color="#eee3c8"/><stop offset="1" stop-color="#c9b78f"/></radialGradient>
    <symbol id="pD" viewBox="0 0 100 100">
      <ellipse cx="51" cy="55" rx="43" ry="41" fill="#000" opacity=".38"/>
      <circle cx="50" cy="50" r="42" fill="url(#gD)" stroke="#08080a" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#6b7080" stroke-width="2.4" opacity=".55"/>
      <circle cx="50" cy="50" r="27.5" fill="none" stroke="#000" stroke-width="1.6" opacity=".55"/>
      <path d="M24 34 A30 30 0 0 1 46 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".18"/>
    </symbol>
    <symbol id="pL" viewBox="0 0 100 100">
      <ellipse cx="51" cy="55" rx="43" ry="41" fill="#000" opacity=".38"/>
      <circle cx="50" cy="50" r="42" fill="url(#gL)" stroke="#8f7c55" stroke-width="2.5"/>
      <circle cx="50" cy="50" r="33" fill="none" stroke="#b8a47b" stroke-width="2.4" opacity=".8"/>
      <circle cx="50" cy="50" r="27.5" fill="none" stroke="#fff" stroke-width="1.6" opacity=".7"/>
      <path d="M24 34 A30 30 0 0 1 46 20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    </symbol>
    <symbol id="crown" viewBox="0 0 100 100">
